<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image to Canvas</title>
    <style>
        body {
            font-family: sans-serif;
            font-size: 20px;
            margin: 20px;
        }
        canvas {
            border: 4px dashed #ccc;
            margin: 0px;
            display: block;
            max-width: 100%;
        }
    </style>
</head>
<body>

    <h2>Upload an Image to Canvas</h2>
    
    <!-- File Input -->
    <input type="file" id="imageLoader" accept="image/*">
    
    <!-- Canvas element -->
    <canvas id="imageCanvas"></canvas>
    <button id="convertButton">Convert Image to GIF</button>

    <script type="importmap">
    {
        "imports": {
            "modern-gif": "https://unpkg.com/modern-gif@^2.1.0/dist/index.mjs",
            "modern-palette": "https://unpkg.com/modern-palette@^2.0.0/dist/index.mjs"
        }
    }
    </script>

    <script type="module">
        import { encode } from 'https://unpkg.com/modern-gif';
        //import workerUrl from 'modern-gif/worker?url' 

        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const convertButton = document.getElementById('convertButton');

        // Create a secondary hidden canvas for processing if you haven't already
        const processingCanvas = document.createElement('canvas');
        const processingCtx = processingCanvas.getContext('2d', { willReadFrequently: true });
        const tempCanvas = document.createElement('canvas');
        const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });

        let ogImg = new Image();
        let img = new Image();

        let handleRect = {
            line: 0,
            x: 0,
            y: 0,
            width: 0,
            height: 0
        };

        let handleSize = 0;
        let rectangles = [];
        let resizeVector = null; // To track which handle is being dragged
        let renderingImg = true; // Flag to indicate if the image is currently being rendered


        // Handle Mouse Down event for resizing handles
        canvas.addEventListener('mousedown', handleMouseDown);
        canvas.addEventListener('mouseup', handleMouseUp);
        canvas.addEventListener('mousemove', handleMouseMove);

        imageLoader.addEventListener('change', handleImageUpload, false);
        convertButton.addEventListener('click', function() {
            if (imageLoader.files.length > 0) {
                handleConvertToGIF();
            } else {
                alert('Please select an image file first.');
            }
        });

        async function renderCanvas() {
            // Clear the canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // Draw the image stretched to fit the canvas
            ctx.drawImage(ogImg, 0, 0, canvas.width, canvas.height);
            drawHandleRectAndImage();
        }

        async function renderRepeatCanvas(repeatCount = 5) {
            renderingImg = true;
            // 1. Initialize processingCanvas with the original image
            processingCtx.clearRect(0, 0, processingCanvas.width, processingCanvas.height);
            processingCtx.drawImage(ogImg, 0, 0, processingCanvas.width, processingCanvas.height);

            for (let i = 0; i < repeatCount; i++) {
                // Clear our processing buffer canvas
                processingCtx.clearRect(0, 0, processingCanvas.width, processingCanvas.height);
                
                // Draw the background base image onto the processing buffer
                processingCtx.drawImage(ogImg, 0, 0, processingCanvas.width, processingCanvas.height);
                
                // Nest the *previous* state (processingCanvas) into the specified rectangle
                processingCtx.drawImage(tempCanvas, handleRect.x, handleRect.y, handleRect.width, handleRect.height);
                
                // Copy the newly accumulated frame back to tempCanvas for the next recursive loop pass
                tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
                tempCtx.drawImage(processingCanvas, 0, 0, processingCanvas.width, processingCanvas.height);
            }

            // Update the image source with the final offscreen state
            img.src = processingCanvas.toDataURL(); 

            // Wait asynchronously for the data URL to be parsed by the browser
            if (!img.complete) {
                await new Promise((resolve) => {
                    img.onload = resolve;
                    img.onerror = resolve; 
                });
            }

            console.log("Final image successfully loaded!");
            renderingImg = false;
        }



        function handleImageUpload(e) {
            console.log("Image upload initiated.");
            const file = e.target.files[0];
            
            // Ensure a file was actually selected
            if (!file) return;

            // 1. First, define what happens when the original image loads
            ogImg.onload = function() {
                console.log(`Original image loaded: ${ogImg.width}x${ogImg.height}`);

                // Set canvas width and maintain aspect ratio
                canvas.width = window.innerWidth - 10; 
                canvas.height = (window.innerWidth - 10) * (ogImg.height / ogImg.width); 
                
                processingCanvas.width = canvas.width;
                processingCanvas.height = canvas.height;
                processingCtx.width = processingCanvas.width;
                processingCtx.height = processingCanvas.height;
                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;
                tempCtx.width = tempCanvas.width;
                tempCtx.height = tempCanvas.height;

                console.log(`Canvas resized to: ${canvas.width}x${canvas.height}`);

                // Initialize target manipulators
                let margin = canvas.width / 8; 
                handleRect = {
                    line: canvas.width / 256, 
                    x: margin,
                    y: margin,
                    width: canvas.width - (margin * 2),
                    height: canvas.height - (margin * 2)
                };
                console.log(`Handle rectangle initialized.`);

                // 2. Define what happens when the secondary 'img' loads (if it relies on ogImg)
                // Replace your old img.onload function with this single line:
                img.addEventListener('load', function() { renderCanvas(); URL.revokeObjectURL(img.src); }, { once: true });

                img.src = ogImg.src;

            };

            // 3. CRITICAL FIX: Set the source OUTSIDE the onload block so it actually triggers
            ogImg.src = URL.createObjectURL(file);

        }

        function drawHandleRectAndImage() {
            renderRepeatCanvas();
            ctx.drawImage(ogImg, handleRect.x, handleRect.y, handleRect.width, handleRect.height);
            drawHandleRect();
        }

        function drawHandleRect() {

            ctx.strokeStyle = 'red';
            ctx.lineWidth = handleRect.line;
            
            // Draw the rectangle path directly
            ctx.strokeRect(handleRect.x, handleRect.y, handleRect.width, handleRect.height);
            ctx.fillStyle = 'blue';

            // draw 9 small squares at the corners and midpoints of the rectangle for resizing handles
            handleSize = handleRect.line * 5; // Size of the small squares

            rectangles = [
                // Top-left corner
                { x: handleRect.x - handleSize / 2, y: handleRect.y - handleSize / 2 },
                // Top-right corner
                { x: handleRect.x + handleRect.width - handleSize / 2, y: handleRect.y - handleSize / 2 },
                // Bottom-left corner
                { x: handleRect.x - handleSize / 2, y: handleRect.y + handleRect.height - handleSize / 2 },
                // Bottom-right corner
                { x: handleRect.x + handleRect.width - handleSize / 2, y: handleRect.y + handleRect.height - handleSize / 2 },
                // Top midpoint
                { x: handleRect.x + handleRect.width / 2 - handleSize / 2, y: handleRect.y - handleSize / 2 },
                // Bottom midpoint
                { x: handleRect.x + handleRect.width / 2 - handleSize / 2, y: handleRect.y + handleRect.height - handleSize / 2 },
                // Left midpoint
                { x: handleRect.x - handleSize / 2, y: handleRect.y + handleRect.height / 2 - handleSize / 2 },
                // Right midpoint
                { x: handleRect.x +	handleRect.width -	handleSize / 2, y:	handleRect.y +	handleRect.height / 2 -	handleSize / 2 }
            ];

            for (let i = 0; i < rectangles.length; i++) {
                const rect = rectangles[i];
                ctx.fillRect(rect.x, rect.y, handleSize, handleSize);
            }
        }


        function onHandleRectChange(newRect) {
            handleRect = newRect;
            drawHandleRectAndImage();
        }

        function getCanvasMousePosition(canvas, event) {
            const rect = canvas.getBoundingClientRect();
        
            // 1. Get mouse position relative to the canvas element on screen
            const clientX = event.clientX - rect.left-4;
            const clientY = event.clientY - rect.top-4;
        
            // 2. Scale to match the internal canvas width/height (resolving CSS stretch)
            const scaleX = (canvas.width + 8) / rect.width;
            const scaleY = (canvas.height + 8) / rect.height;
        
            return {
                x: (clientX * scaleX),
                y: (clientY * scaleY)
            };
        }
        function drawPoint(ctx, x, y, radius = 3, color = 'black') {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI); // Draw a full 360-degree circle
            ctx.fillStyle = color;
            ctx.fill();
        }
        function handleMouseDown(e) {
            console.log(`Mouse down at (${e.offsetX}, ${e.offsetY})`);
            
            let mousePos = getCanvasMousePosition(canvas, e);
            // (debug) draw green dot where mouse is clicked
            // drawPoint(ctx, mousePos.x, mousePos.y, 2, 'green');
            // Implement logic to detect if a handle is clicked and start resizing
            for (let i = 0; i < rectangles.length; i++) {
                const rect = rectangles[i];
                // offset slightly down and to the right gets worse as farther out (fixed by adjusting margin above and finding mouse coordinates relative to canvas instead of window)
                if (mousePos.x >= rect.x && mousePos.x <= rect.x + handleSize &&
                    mousePos.y >= rect.y && mousePos.y <= rect.y + handleSize) {
                    // Start resizing logic here
                    if (i === 0) { // Top-left corner
                        resizeVector = [-1, -1];
                    } else if (i === 1) { // Top-right corner
                        resizeVector = [1, -1];
                    } else if (i === 2) { // Bottom-left corner
                        resizeVector = [-1, 1];
                    } else if (i === 3) { // Bottom-right corner
                        resizeVector = [1, 1];
                    } else if (i === 4) { // Top midpoint
                        resizeVector = [0, -1];
                    } else if (i === 5) { // Bottom midpoint
                        resizeVector = [0, 1];
                    } else if (i === 6) { // Left midpoint
                        resizeVector = [-1, 0];
                    } else if (i === 7) { // Right midpoint
                        resizeVector = [1, 0];
                    }
                    break;
                }
            }
        }

        function handleMouseUp(e) {
            // Stop resizing logic here
            resizeVector = null;
        }

        function handleMouseMove(e) {
            if (resizeVector) {
                // Implement resizing logic based on mouse movement and resizeVector
                const mousePos = getCanvasMousePosition(canvas, e);
                // Update handleRect dimensions based on mouse position and resizeVector
                if (resizeVector[0] === -1) {
                    handleRect.width = handleRect.width + (handleRect.x - mousePos.x);
                    handleRect.x = mousePos.x;
                }
                if (resizeVector[1] === -1) {
                    handleRect.height = handleRect.height + (handleRect.y - mousePos.y);
                    handleRect.y = mousePos.y;
                }
                if (resizeVector[0] === 1) {
                    handleRect.width = mousePos.x - handleRect.x;
                }
                if (resizeVector[1] === 1) {
                    handleRect.height = mousePos.y - handleRect.y;
                }

                // Redraw the rectangle with new dimensions
                renderCanvas();
            }
        }

        function handleConvertToGIF() {
            console.log("starting generating gif")
            // start at static render then zoom towards the target rectangle, then repeat the process to create a GIF effect until zoom reaches the target and photo resets
            const currentAspectRatio = canvas.width / canvas.height;
            const targetAspectRatio = handleRect.width / handleRect.height;

            renderRepeatCanvas(10);

            const frameCollection = [];
            
            let interpolation = 0; // Start with no zoom
            let increment = 0.02; // Set a maximum number of frames for the GIF effect
            let delay = 0; // Delay between frames in milliseconds
            let scaleX1 = 0, scaleX2 = 0, scaleY1 = 0, scaleY2 = 0;

            console.log(interpolation, increment, interpolation * increment);

            async function animateZoomLoop() {
                // move the target rectengle corners toawards canvas corners then scale the image behind to match the zoom
                // Implement the zooming and warping logic here
                const imageInRect = {
                    x1: handleRect.x * (1 - interpolation),
                    y1: handleRect.y * (1 - interpolation),
                    x2: handleRect.x + handleRect.width + ((canvas.width - (handleRect.x + handleRect.width)) * interpolation),
                    y2: handleRect.y + handleRect.height + ((canvas.height - (handleRect.y + handleRect.height)) * interpolation)
                };

                console.log("\n")
                console.log(interpolation)
                
                scaleX1 = (handleRect.x - imageInRect.x1) / (handleRect.width/2);
                scaleY1 = (handleRect.y - imageInRect.y1) / (handleRect.height/2);
                scaleX2 = ((handleRect.x + handleRect.width) - imageInRect.x2) / (handleRect.width/2);
                scaleY2 = ((handleRect.y + handleRect.height) - imageInRect.y2) / (handleRect.height/2);

                if (!scaleX1) { scaleX1 = 0; }
                if (!scaleY1) { scaleY1 = 0; }
                if (!scaleX2) { scaleX2 = 0; }
                if (!scaleY2) { scaleY2 = 0; }

                const canvasRect = {
                    x1: 0 - ((canvas.width/2) * scaleX1),
                    y1: 0 - ((canvas.height/2) * scaleY1),
                    x2: canvas.width - ((canvas.width/2) * scaleX2),
                    y2: canvas.height - ((canvas.height/2) * scaleY2)
                };
                // Clear the canvas and draw the image in the new rectangle
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(ogImg, canvasRect.x1, canvasRect.y1, canvasRect.x2 - canvasRect.x1, canvasRect.y2 - canvasRect.y1);
                ctx.drawImage(img, imageInRect.x1, imageInRect.y1, imageInRect.x2 - imageInRect.x1, imageInRect.y2 - imageInRect.y1);
            
                const rawPixels = ctx.getImageData(0, 0, canvas.width, canvas.height);
    
                // Push the raw image data object and frame delay to the memory array
                frameCollection.push({
                    data: rawPixels.data, // Uint8ClampedArray containing RGBA data
                    delay: 100            // Frame delay in milliseconds
                });

                interpolation = interpolation + increment;
                    
                if (1 > interpolation) {
                    animateZoomLoop();
                } else {
                    // --- 3. ANIMATION COMPLETED: Run local encoding using a pure promise chain ---
                    console.log("Render loop complete. Encoding frames locally on main thread...");
                    
                    const output = await encode({
                    width: canvas.width,
                    height: canvas.height,
                    frames: frameCollection,
                    })

                    const blob = new Blob([output], { type: 'image/gif' })
                    window.open(URL.createObjectURL(blob))
                }
            }
            animateZoomLoop()
        }
    </script>

</body>
</html>
