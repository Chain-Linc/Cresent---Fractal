<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image to Canvas</title>
    <style>
        body {
            font-family: sans-serif;
            font-size: 20px;
            margin: 20px;
        }
        canvas {
            border: 4px dashed #ccc;
            margin: 5px;
            display: block;
            max-width: 100%;
        }
    </style>
</head>
<body>

    <h2>Upload an Image to Canvas</h2>
    
    <!-- File Input -->
    <input type="file" id="imageLoader" accept="image/*">
    
    <!-- Canvas element -->
    <canvas id="imageCanvas"></canvas>
    <button id="convertButton">Convert Image to GIF</button>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const convertButton = document.getElementById('convertButton');

        imageLoader.addEventListener('change', handleImageUpload, false);
        convertButton.addEventListener('click', function() {
            if (imageLoader.files.length > 0) {
                handleImage({ target: imageLoader });
            } else {
                alert('Please select an image file first.');
            }
        });

        let handleRect = {
            line: 0,
            x: 0,
            y: 0,
            width: 0,
            height: 0
        };

        function handleImageUpload(e) {
            const file = e.target.files[0];
            
            // Ensure a file was actually selected
            if (!file) return;

            const img = new Image();

            // When the image loads, draw it to the canvas
            img.onload = function() {
                // Resize the canvas to match the uploaded image dimensions
                canvas.width = window.innerWidth-10; // Set canvas width to the page width
                canvas.height = (window.innerWidth-10) * (img.height / img.width); // Maintain aspect ratio based on the image's dimensions
                console.log(`Canvas resized to: ${canvas.width}x${canvas.height}`);

                // Clear the canvas and draw the image at position (0,0)
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // Draws and stretches the image to match the exact size of the canvas
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                
                console.log(`Image drawn at (0,0) with dimensions: ${img.width}x${img.height}`);

                // Add rect target manipulators for the repeating image zooming effect
                let margin = canvas.width / 8; // Set margin to 1/32 of the canvas width
                handleRect = {
                    line: canvas.width / 128, // Set line width relative to the rectangle size
                    x: margin,
                    y: margin,
                    width: canvas.width - (margin * 2),
                    height: canvas.height - (margin * 2)
                };
                drawHandleRect(); // Draw the rectangle on the canvas

                // Clean up the memory allocated for the object URL
                URL.revokeObjectURL(img.src);
            };

            // Create a temporary local URL pointing to the uploaded file
            img.src = URL.createObjectURL(file);
        }
        
        function drawHandleRect() {
            // 1. Ensure ctx is correctly referenced and handleRect properties match lowercase/uppercase expectations.
            // 2. Fallback check: if width/height are named 'w' or 'h' instead of 'width' or 'height', map them.
            console.log(`Drawing rectangle at (${handleRect.x}, ${handleRect.y}) with width ${handleRect.width} and height ${handleRect.height}`);
            ctx.strokeStyle = 'red';
            ctx.lineWidth = handleRect.line;
            
            // Draw the rectangle path directly
            ctx.strokeRect(handleRect.x, handleRect.y, handleRect.width, handleRect.height);
        
            // draw 9 small squares at the corners and midpoints of the rectangle for resizing handles
            const handleSize = handleRect.line*5; // Size of the small squares
            ctx.fillStyle = 'blue';
            // Top-left corner
            
        }


        function onHandleRectChange(newRect) {
            handleRect = newRect;
            // Redraw the image with the new rectangle dimensions
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, handleRect.x, handleRect.y, handleRect.width, handleRect.height);
        }

    </script>

</body>
</html>
