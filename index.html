<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image to Canvas</title>
    <style>
        body {
            font-family: sans-serif;
            font-size: 20px;
            margin: 20px;
        }
        canvas {
            border: 4px dashed #ccc;
            margin: 15px;
            display: block;
            max-width: 100%;
        }
    </style>
</head>
<body>

    <h2>Upload an Image to Canvas</h2>
    
    <!-- File Input -->
    <input type="file" id="imageLoader" accept="image/*">
    
    <!-- Canvas element -->
    <canvas id="imageCanvas"></canvas>
    <button id="convertButton">Convert Image to GIF</button>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const convertButton = document.getElementById('convertButton');

        imageLoader.addEventListener('change', handleImageUpload, false);
        convertButton.addEventListener('click', function() {
            if (imageLoader.files.length > 0) {
                handleImage({ target: imageLoader });
            } else {
                alert('Please select an image file first.');
            }
        });

        function handleImageUpload(e) {
            const file = e.target.files[0];
            
            // Ensure a file was actually selected
            if (!file) return;

            const img = new Image();

            // When the image loads, draw it to the canvas
            img.onload = function() {
                // Resize the canvas to match the uploaded image dimensions
                canvas.width = window.innerWidth; // Set canvas width to the page width
                canvas.height = window.innerWidth * (img.height / img.width); // Maintain aspect ratio based on the image's dimensions

                // Clear the canvas and draw the image at position (0,0)
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.scale(canvas.width / img.width, canvas.height / img.height); // Scale the image to fit the canvas
                ctx.drawImage(img, 0, 0);
                
                // Add rect target manipulators for the repeating image zooming effect
                let handleRect = {
                    x: canvas.width / 8,
                    y: canvas.height / 8,
                    width: canvas.width - (canvas.width / 4),
                    height: canvas.height - (canvas.height / 4)
                };
                console.log(`Drawing rectangle at (${x}, ${y}) with width ${w} and height ${h}2`);
                drawHandleRect();
                
                // Clean up the memory allocated for the object URL
                URL.revokeObjectURL(img.src);
            };

            // Create a temporary local URL pointing to the uploaded file
            img.src = URL.createObjectURL(file);
        }
        
        function drawHandleRect() {
            // 1. Ensure ctx is correctly referenced and handleRect properties match lowercase/uppercase expectations.
            // 2. Fallback check: if width/height are named 'w' or 'h' instead of 'width' or 'height', map them.
            const x = handleRect.x;
            const y = handleRect.y;
            const w = handleRect.width !== undefined ? handleRect.width : handleRect.w;
            const h = handleRect.height !== undefined ? handleRect.height : handleRect.h;

            console.log(`Drawing rectangle at (${x}, ${y}) with width ${w} and height ${h}`);
            ctx.strokeStyle = 'red';
            ctx.lineWidth = 4;
            
            // Draw the rectangle path directly
            ctx.strokeRect(x, y, w, h);
        }


        function onHandleRectChange(newRect) {
            handleRect = newRect;
            // Redraw the image with the new rectangle dimensions
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, handleRect.x, handleRect.y, handleRect.width, handleRect.height);
        }

    </script>

</body>
</html>
